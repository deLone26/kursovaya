<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoilerMaintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        :root {
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --card-bg: #ffffff;
        }

        body {
            background: var(--sidebar-bg);
            height: 100vh;
            overflow: hidden;
        }

        /* Меню */
        .menu {
            height: 100vh;
            overflow-y: auto;
            padding: 20px 0;
            background: var(--sidebar-bg);
        }

        .menu-header {
            padding: 0 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .menu-header h2 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .menu-header p {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-section {
            margin-bottom: 16px;
        }

        .section-title {
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            margin: 2px 8px;
            border-radius: 8px;
            gap: 12px;
            position: relative;
        }

        .menu-item:hover {
            background: var(--sidebar-hover);
        }

        .menu-item.active {
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .menu-icon {
            font-size: 18px;
            min-width: 24px;
            text-align: center;
        }

        .menu-text {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }

        .badge {
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
        }

        .menu-footer {
            margin-top: 40px;
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* Сворачивание меню */
        .menu.collapsed .menu-text,
        .menu.collapsed .section-title,
        .menu.collapsed .badge,
        .menu.collapsed .menu-header p {
            display: none;
        }

        .menu.collapsed .menu-item {
            padding: 10px;
            justify-content: center;
        }

        .menu.collapsed .menu-icon {
            margin: 0;
            font-size: 20px;
        }

        .menu.collapsed .menu-header h2 {
            font-size: 0;
        }

        .menu.collapsed .menu-header h2::after {
            content: "⚡";
            font-size: 20px;
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Анимации */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .menu-item {
            animation: slideIn 0.2s ease-out;
        }
    </style>
</head>
<body>
    <div class="menu" id="menu">
        <div class="menu-header">
            <h2>⚡ BoilerMaintenance</h2>
            <p>Техническое обслуживание</p>
        </div>

        <!-- ГЛАВНОЕ -->
        <div class="menu-section">
            <div class="section-title">ГЛАВНОЕ</div>
            <div class="menu-item active" data-page="home">
                <span class="menu-icon">🏠</span>
                <span class="menu-text">Главная</span>
            </div>
            <div class="menu-item" data-page="dashboard">
                <span class="menu-icon">📊</span>
                <span class="menu-text">Дашборд</span>
                <span class="badge">5</span>
            </div>
        </div>

        <!-- ОБОРУДОВАНИЕ -->
        <div class="menu-section">
            <div class="section-title">ОБОРУДОВАНИЕ</div>
            <div class="menu-item" data-page="equipment">
                <span class="menu-icon">🔧</span>
                <span class="menu-text">Всё оборудование</span>
            </div>
            <div class="menu-item" data-page="accidents">
                <span class="menu-icon">⚠️</span>
                <span class="menu-text">Аварии</span>
                <span class="badge">3</span>
            </div>
            <div class="menu-item" data-page="repairs">
                <span class="menu-icon">🔨</span>
                <span class="menu-text">Ремонты</span>
            </div>
            <div class="menu-item" data-page="passports">
                <span class="menu-icon">📋</span>
                <span class="menu-text">Паспорта</span>
            </div>
        </div>

        <!-- ПЛАНИРОВАНИЕ -->
        <div class="menu-section">
            <div class="section-title">ПЛАНИРОВАНИЕ</div>
            <div class="menu-item" data-page="plans">
                <span class="menu-icon">📅</span>
                <span class="menu-text">Планы ТО</span>
            </div>
            <div class="menu-item" data-page="schedules">
                <span class="menu-icon">📈</span>
                <span class="menu-text">Графики</span>
            </div>
        </div>

        <!-- РУКОВОДСТВО (видно только админам и начальникам) -->
        <div class="menu-section" id="bossSection" style="display: none;">
            <div class="section-title">РУКОВОДСТВО</div>
            <div class="menu-item" data-page="boss">
                <span class="menu-icon">👑</span>
                <span class="menu-text">Панель начальника</span>
            </div>
            <div class="menu-item" data-page="employees">
                <span class="menu-icon">👥</span>
                <span class="menu-text">Сотрудники</span>
            </div>
            <div class="menu-item" data-page="budget">
                <span class="menu-icon">💰</span>
                <span class="menu-text">Бюджет</span>
            </div>
        </div>

        <!-- ВЫХОД -->
        <div class="menu-footer">
            <div class="menu-item" data-page="exit">
                <span class="menu-icon">🚪</span>
                <span class="menu-text">Выход</span>
            </div>
        </div>
    </div>

    <script>
        // Обработка кликов по меню
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                
                document.querySelectorAll('.menu-item').forEach(i => 
                    i.classList.remove('active')
                );
                
                this.classList.add('active');
                
                const page = this.dataset.page;
                if (window.chrome.webview) {
                    window.chrome.webview.postMessage(page);
                }
            });
        });

        // Установка роли пользователя
        function setUserRole(role) {
            const isBoss = role === 'admin' || role === 'boss';
            const bossSection = document.getElementById('bossSection');
            
            if (bossSection) {
                bossSection.style.display = isBoss ? 'block' : 'none';
            }
        }

        // Сворачивание меню
        function toggleMenu(collapsed) {
            const menu = document.getElementById('menu');
            if (collapsed) {
                menu.classList.add('collapsed');
            } else {
                menu.classList.remove('collapsed');
            }
        }

        // Обновление счетчиков
        function updateBadges(data) {
            const accidentBadge = document.querySelector('[data-page="accidents"] .badge');
            if (accidentBadge && data.accidentsCount) {
                accidentBadge.textContent = data.accidentsCount;
            }
            
            const dashboardBadge = document.querySelector('[data-page="dashboard"] .badge');
            if (dashboardBadge && data.notificationsCount) {
                dashboardBadge.textContent = data.notificationsCount;
            }
        }
    </script>
</body>
</html>
