<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление сотрудниками</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/employees.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>УПРАВЛЕНИЕ СОТРУДНИКАМИ</h1>
            <div class="user-info" id="userInfo">
                <i class="fas fa-user-circle"></i>
                <span>Загрузка...</span>
            </div>
        </div>

        <div class="content">
            <!-- Левая панель - таблица -->
            <div class="left-panel">
                <div class="panel-header">
                    <h2>СПИСОК СОТРУДНИКОВ</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Поиск по фамилии или ID...">
                        <button onclick="searchEmployees()">Найти</button>
                        <button onclick="loadEmployees()" class="refresh-btn">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ФАМИЛИЯ</th>
                                <th>ИМЯ</th>
                                <th>ОТЧЕСТВО</th>
                                <th>ТЕЛЕФОН</th>
                                <th>EMAIL</th>
                                <th>РОЛЬ</th>
                            </tr>
                        </thead>
                        <tbody id="employeesTableBody">
                            <tr>
                                <td colspan="7" class="loading-row">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p>Загрузка данных...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-value" id="totalEmployees">0</div>
                        <div class="stat-label">Всего сотрудников</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="activeEmployees">0</div>
                        <div class="stat-label">Активных</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalRoles">4</div>
                        <div class="stat-label">Ролей</div>
                    </div>
                </div>
            </div>

            <!-- Правая панель - форма -->
            <div class="right-panel" id="rightPanel">
                <div class="form-section">
                    <h3>ЛИЧНЫЕ ДАННЫЕ</h3>
                    
                    <div class="form-group">
                        <label class="required">Фамилия</label>
                        <input type="text" id="familiya" placeholder="Введите фамилию">
                    </div>
                    
                    <div class="form-group">
                        <label class="required">Имя</label>
                        <input type="text" id="imya" placeholder="Введите имя">
                    </div>
                    
                    <div class="form-group">
                        <label>Отчество</label>
                        <input type="text" id="otchestvo" placeholder="Введите отчество">
                    </div>
                    
                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="text" id="telefon" placeholder="+7 (999) 123-45-67">
                    </div>
                    
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="example@mail.com">
                    </div>
                </div>

                <div class="form-section">
                    <h3>УЧЕТНАЯ ЗАПИСЬ</h3>
                    
                    <div class="form-group">
                        <label class="required">Логин</label>
                        <input type="text" id="login" placeholder="Введите логин">
                    </div>
                    
                    <div class="form-group">
                        <label class="required">Пароль</label>
                        <input type="password" id="password" placeholder="Введите пароль">
                        <div class="password-hint">Минимум 6 символов</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="required">Роль</label>
                        <select id="role">
                            <option value="operator">Оператор</option>
                            <option value="slesar">Слесарь</option>
                            <option value="boss">Начальник котельной</option>
                            <option value="admin">Администратор</option>
                        </select>
                    </div>
                </div>

                <div class="action-buttons" id="actionButtons">
                    <button class="btn btn-add" onclick="addEmployee()">ДОБАВИТЬ</button>
                    <button class="btn btn-update" onclick="updateEmployee()">ОБНОВИТЬ</button>
                    <button class="btn btn-delete" onclick="deleteEmployee()">УДАЛИТЬ</button>
                    <button class="btn btn-clear" onclick="clearForm()">ОЧИСТИТЬ</button>
                </div>

                <input type="hidden" id="selectedEmployeeId" value="-1">
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="js/employees.js"></script>
</body>
</html>
