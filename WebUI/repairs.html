<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои задания - Слесарь</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .app { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .user { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: #dc3545; border: none; color: white; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .hidden { display: none; }
        .stats { display: flex; gap: 20px; margin: 25px; flex-wrap: wrap; }
        .stat { background: #f8f9fa; border-radius: 12px; padding: 15px 25px; text-align: center; flex: 1; min-width: 120px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #1e3c72; }
        .stat-label { font-size: 12px; color: #666; margin-top: 5px; }
        .filters { display: flex; gap: 15px; margin: 0 25px 20px 25px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; font-weight: 600; color: #666; }
        input { padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 6px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0069d9; }
        .check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin: 25px; width: calc(100% - 50px); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background: #f8f9fa; font-weight: 600; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-progress { background: #cce5ff; color: #004085; }
        .status-pending { background: #fff3cd; color: #856404; }
        .btn-complete { background: #28a745; padding: 5px 12px; font-size: 12px; }
        .btn-complete:hover { background: #218838; }
        .loading { text-align: center; padding: 40px; color: #999; margin: 25px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 12px; width: 450px; max-width: 90%; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; }
        .close { font-size: 24px; cursor: pointer; color: #999; }
        .close:hover { color: #333; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid #dee2e6; display: flex; justify-content: flex-end; gap: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        textarea { width: 100%; padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 6px; resize: vertical; font-family: inherit; }
        .btn-secondary { background: #6c757d; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 20px; border-radius: 8px; z-index: 1100; }
        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h2>Мои задания</h2>
        <div class="user">
            <span id="userName">Загрузка...</span>
            <button id="logoutBtn" class="logout-btn hidden">Выход</button>
        </div>
    </div>

    <div class="stats" id="statsPanel"></div>

    <div class="filters">
        <div class="filter-group"><label>Дата от</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>Дата до</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label class="check-label"><input type="checkbox" id="showAll"> <span>Показать все</span></label></div>
        <button id="applyFilterBtn">Применить</button>
    </div>

    <div id="tasksTable">Загрузка...</div>
</div>

<div id="completeModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header"><h3>Выполнение задания</h3><span class="close" onclick="closeModal('completeModal')">&times;</span></div>
        <div class="modal-body">
            <input type="hidden" id="taskId">
            <div class="form-group"><label>Дата начала</label><input type="date" id="actualStartDate"></div>
            <div class="form-group"><label>Дата окончания</label><input type="date" id="actualEndDate"></div>
            <div class="form-group"><label>Описание работ</label><textarea id="completionDesc" rows="4" placeholder="Что было сделано..."></textarea></div>
        </div>
        <div class="modal-footer"><button id="confirmCompleteBtn" class="btn-complete">Отметить завершённым</button><button class="btn-secondary" onclick="closeModal('completeModal')">Отмена</button></div>
    </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
    let currentEmployeeId = 0;
    let currentUserRole = '';

    function setCurrentUser(id, login, role, fullName) {
        currentEmployeeId = id;
        currentUserRole = role;
        document.getElementById('userName').innerHTML = fullName;
        
        const logoutBtn = document.getElementById('logoutBtn');
        if (role === 'app_slesar') {
            logoutBtn.classList.remove('hidden');
            logoutBtn.onclick = function() { logout(); };
        } else {
            logoutBtn.classList.add('hidden');
        }
    }

    function logout() {
        if (window.chrome?.webview) {
            window.chrome.webview.postMessage(JSON.stringify({ action: 'logout' }));
        }
    }

    function showToast(msg, type) {
        let toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast ' + (type || '');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    window.receiveFromCSharp = function(command, data) {
        if (command === 'displayTasks') displayTasks(data);
        else if (command === 'updateStatistics') updateStatistics(data);
        else if (command === 'showSuccess') showToast(data, 'success');
        else if (command === 'showError') showToast(data, 'error');
    };

    function loadTasks(startDate, endDate, showAll) {
        if (window.chrome?.webview) {
            window.chrome.webview.postMessage(JSON.stringify({ action: 'loadTasks', startDate, endDate, showAll }));
        }
    }

    function displayTasks(data) {
        let tasks = typeof data === 'string' ? JSON.parse(data) : data;
        if (!tasks || tasks.length === 0) {
            document.getElementById('tasksTable').innerHTML = '<div class="loading">Нет заданий</div>';
            return;
        }
        
        // Для слесаря показываем только незавершённые задания
        let activeTasks = tasks.filter(t => t.status !== 'Завершен');
        
        if (activeTasks.length === 0) {
            document.getElementById('tasksTable').innerHTML = '<div class="loading">Нет активных заданий</div>';
            updateStatistics({ total: tasks.length, completed: tasks.filter(t => t.status === 'Завершен').length, inProgress: tasks.filter(t => t.status === 'В работе').length, overdue: tasks.filter(t => t.status === 'Просрочен').length });
            return;
        }
        
        let html = '<table><thead><tr><th>ID</th><th>Оборудование</th><th>Тип ТО</th><th>Плановая дата</th><th>Статус</th><th></th></tr></thead><tbody>';
        for (let t of activeTasks) {
            let statusClass = (t.status === 'Завершен') ? 'status-completed' : ((t.status === 'В работе') ? 'status-progress' : 'status-pending');
            let statusText = (t.status === 'Завершен') ? 'Выполнено' : ((t.status === 'В работе') ? 'В работе' : 'Ожидает');
            html += '<tr>';
            html += '<td>' + t.id + '</td>';
            html += '<td>' + escapeHtml(t.equipment) + '</td>';
            html += '<td>' + escapeHtml(t.tip) + '</td>';
            html += '<td>' + (t.start_date || '—') + '</td>';
            html += '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>';
            html += '<td><button class="btn-complete" onclick="openCompleteModal(' + t.id + ')">Отметить завершённым</button></td>';
            html += '</tr>';
        }
        html += '</tbody></table>';
        document.getElementById('tasksTable').innerHTML = html;
        
        // Обновляем статистику по всем заданиям
        updateStatistics({
            total: tasks.length,
            completed: tasks.filter(t => t.status === 'Завершен').length,
            inProgress: tasks.filter(t => t.status === 'В работе').length,
            overdue: tasks.filter(t => t.status === 'Просрочен').length
        });
    }

    function updateStatistics(data) {
        let s = typeof data === 'string' ? JSON.parse(data) : data;
        document.getElementById('statsPanel').innerHTML = 
            '<div class="stat"><div class="stat-value">' + (s.total || 0) + '</div><div class="stat-label">Всего заданий</div></div>' +
            '<div class="stat"><div class="stat-value">' + (s.completed || 0) + '</div><div class="stat-label">Выполнено</div></div>' +
            '<div class="stat"><div class="stat-value">' + (s.inProgress || 0) + '</div><div class="stat-label">В работе</div></div>' +
            '<div class="stat"><div class="stat-value">' + (s.overdue || 0) + '</div><div class="stat-label">Просрочено</div></div>';
    }

    function openCompleteModal(taskId) {
        document.getElementById('taskId').value = taskId;
        document.getElementById('actualStartDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('actualEndDate').value = '';
        document.getElementById('completionDesc').value = '';
        document.getElementById('completeModal').style.display = 'flex';
    }

    function confirmComplete() {
        let id = document.getElementById('taskId').value;
        let desc = document.getElementById('completionDesc').value;
        let start = document.getElementById('actualStartDate').value;
        let end = document.getElementById('actualEndDate').value;
        if (!desc) { showToast('Введите описание!', 'error'); return; }
        if (window.chrome?.webview) {
            window.chrome.webview.postMessage(JSON.stringify({
                action: 'completeTask',
                id: parseInt(id),
                description: desc,
                actualStartDate: start,
                actualEndDate: end
            }));
        }
        closeModal('completeModal');
    }

    function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    let today = new Date();
    let monthAgo = new Date();
    monthAgo.setMonth(monthAgo.getMonth() - 1);
    document.getElementById('startDate').value = monthAgo.toISOString().split('T')[0];
    document.getElementById('endDate').value = today.toISOString().split('T')[0];

    document.getElementById('applyFilterBtn').onclick = function() {
        let start = document.getElementById('startDate').value;
        let end = document.getElementById('endDate').value;
        let all = document.getElementById('showAll').checked;
        loadTasks(start, end, all);
    };

    document.getElementById('confirmCompleteBtn').onclick = confirmComplete;

    loadTasks('', '', true);
</script>
</body>
</html>
