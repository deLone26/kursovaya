<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление оборудованием</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/equipment.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-industry"></i> УПРАВЛЕНИЕ ОБОРУДОВАНИЕМ</h1>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="userName">Оператор</span>
            </div>
        </div>

        <div class="content">
            <!-- Левая панель - таблица -->
            <div class="left-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-list"></i> СПИСОК ОБОРУДОВАНИЯ</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Поиск по названию, типу, модели...">
                        <button onclick="searchEquipment()">
                            <i class="fas fa-search"></i> Найти
                        </button>
                        <button class="refresh-btn" onclick="loadEquipment()">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>НАЗВАНИЕ</th>
                                <th>ТИП</th>
                                <th>МОДЕЛЬ</th>
                                <th>СЕРИЙНЫЙ №</th>
                                <th>МЕСТО</th>
                                <th>СТАТУС</th>
                            </tr>
                        </thead>
                        <tbody id="equipmentTableBody">
                            <tr>
                                <td colspan="7" class="loading-row">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p>Загрузка данных...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-value" id="totalEquipment">0</div>
                        <div class="stat-label">Всего единиц</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="activeEquipment">0</div>
                        <div class="stat-label">В работе</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="repairEquipment">0</div>
                        <div class="stat-label">В ремонте</div>
                    </div>
                </div>
            </div>

            <!-- Правая панель - форма -->
            <div class="right-panel">
                <div class="form-section">
                    <h3><i class="fas fa-cog"></i> ОСНОВНЫЕ ДАННЫЕ</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">Название</label>
                            <input type="text" id="nazvanie" placeholder="Введите название">
                        </div>
                        <div class="form-group">
                            <label class="required">Тип</label>
                            <input type="text" id="tip" placeholder="Введите тип">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">Модель</label>
                            <input type="text" id="model" placeholder="Введите модель">
                        </div>
                        <div class="form-group">
                            <label>Серийный номер</label>
                            <input type="text" id="seriinomer" placeholder="Введите серийный номер">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Место установки</label>
                        <input type="text" id="mesto" placeholder="Введите место установки">
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-chart-line"></i> ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Мощность (кВт)</label>
                            <input type="number" id="moshnost" placeholder="0.00" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Давление (МПа)</label>
                            <input type="number" id="davlenie" placeholder="0.00" step="0.01">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Производитель</label>
                            <input type="text" id="proizvoditel" placeholder="Введите производителя">
                        </div>
                        <div class="form-group">
                            <label>Дата установки</label>
                            <input type="date" id="dataUstanovki">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-info-circle"></i> СОСТОЯНИЕ</h3>
                    
                    <div class="form-group">
                        <label class="required">Статус</label>
                        <select id="status">
                            <!-- Загружается из БД -->
                        </select>
                    </div>
                </div>

                <!-- Скрытое поле для ID выбранного оборудования -->
                <input type="hidden" id="selectedEquipmentId" value="-1">

                <div class="action-buttons">
                    <button class="btn btn-add" onclick="addEquipment()">
                        <i class="fas fa-plus"></i> ДОБАВИТЬ
                    </button>
                    <button class="btn btn-update" onclick="updateEquipment()">
                        <i class="fas fa-save"></i> ОБНОВИТЬ
                    </button>
                    <button class="btn btn-delete" onclick="deleteEquipment()">
                        <i class="fas fa-trash"></i> УДАЛИТЬ
                    </button>
                    <button class="btn btn-clear" onclick="clearForm()">
                        <i class="fas fa-eraser"></i> ОЧИСТИТЬ
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/equipment.js"></script>
</body>
</html>
