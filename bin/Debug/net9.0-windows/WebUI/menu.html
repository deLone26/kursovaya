<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(180deg, #1a1e2b 0%, #2a2f3f 100%);
            height: 100vh;
            overflow: hidden;
        }
        
        .menu {
            height: 100vh;
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .menu-header {
            padding: 20px 15px;
            border-bottom: 1px solid #3a4050;
            margin-bottom: 10px;
        }
        
        .menu-header h3 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }
        
        .menu-header p {
            color: #8f9bb3;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .menu-section {
            margin-bottom: 15px;
        }
        
        .section-title {
            color: #8f9bb3;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 15px 5px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 2px 8px;
            border-radius: 8px;
        }
        
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .menu-item.active {
            background: linear-gradient(90deg, #4f8ef7 0%, #6c5ce7 100%);
            box-shadow: 0 4px 15px rgba(79, 142, 247, 0.3);
        }
        
        .menu-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .menu-icon img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
        }
        
        .menu-text {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }
        
        .badge {
            background: #ff4757;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        .menu-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            border-top: 1px solid #3a4050;
            background: #1a1e2b;
        }
        
        /* Анимация сворачивания */
        .menu.collapsed .menu-text,
        .menu.collapsed .section-title,
        .menu.collapsed .badge {
            display: none;
        }
        
        .menu.collapsed .menu-item {
            padding: 12px;
            justify-content: center;
        }
        
        .menu.collapsed .menu-icon {
            margin-right: 0;
        }
        
        .menu.collapsed .menu-header {
            text-align: center;
        }
        
        .menu.collapsed .menu-header p {
            display: none;
        }
        
        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #2a2f3f;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4a5060;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #5a6070;
        }
    </style>
</head>
<body>
    <div class="menu" id="menu">
        <div class="menu-header">
            <h3>⚙️ Котельная</h3>
            <p>Управление оборудованием</p>
        </div>
        
        <div class="menu-section">
            <div class="section-title">ГЛАВНОЕ</div>
            <div class="menu-item active" data-page="home">
                <span class="menu-icon">🏠</span>
                <span class="menu-text">Главная</span>
            </div>
            <div class="menu-item" data-page="dashboard">
                <span class="menu-icon">📊</span>
                <span class="menu-text">Дашборд</span>
            </div>
        </div>
        
        <div class="menu-section">
            <div class="section-title">ОБОРУДОВАНИЕ</div>
            <div class="menu-item" data-page="equipment">
                <span class="menu-icon">🔧</span>
                <span class="menu-text">Всё оборудование</span>
            </div>
            <div class="menu-item" data-page="accidents">
                <span class="menu-icon">⚠️</span>
                <span class="menu-text">Аварии</span>
                <span class="badge">3</span>
            </div>
            <div class="menu-item" data-page="repairs">
                <span class="menu-icon">🔨</span>
                <span class="menu-text">Ремонты</span>
            </div>
            <div class="menu-item" data-page="passports">
                <span class="menu-icon">📋</span>
                <span class="menu-text">Паспорта</span>
            </div>
        </div>
        
        <div class="menu-section">
            <div class="section-title">ПЛАНИРОВАНИЕ</div>
            <div class="menu-item" data-page="plans">
                <span class="menu-icon">📅</span>
                <span class="menu-text">Планы ТО</span>
            </div>
            <div class="menu-item" data-page="schedules">
                <span class="menu-icon">📈</span>
                <span class="menu-text">Графики</span>
            </div>
        </div>
        
        <div class="menu-section">
            <div class="section-title">РУКОВОДСТВО</div>
            <div class="menu-item" data-page="boss">
                <span class="menu-icon">👑</span>
                <span class="menu-text">Панель начальника</span>
            </div>
            <div class="menu-item" data-page="employees">
                <span class="menu-icon">👥</span>
                <span class="menu-text">Сотрудники</span>
            </div>
            <div class="menu-item" data-page="budget">
                <span class="menu-icon">💰</span>
                <span class="menu-text">Бюджет</span>
            </div>
        </div>
        
        <div class="menu-footer">
            <div class="menu-item" data-page="exit">
                <span class="menu-icon">🚪</span>
                <span class="menu-text">Выход</span>
            </div>
        </div>
    </div>
    
    <script>
        const menu = document.getElementById('menu');
        
        // Обработка кликов
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                const page = this.dataset.page;
                if (window.chrome.webview) {
                    window.chrome.webview.postMessage(page);
                }
            });
        });
        
        // Сворачивание/разворачивание
        window.toggleMenu = function(collapsed) {
            if (collapsed) {
                menu.classList.add('collapsed');
            } else {
                menu.classList.remove('collapsed');
            }
        };
    </script>
</body>
</html>
